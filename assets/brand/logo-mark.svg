  <g fill="#0B1020" stroke="#A5B4FC" stroke-width="8">
    <circle cx="56" cy="56" r="13"/><circle cx="128" cy="56" r="13"/><circle cx="200" cy="56" r="13"/>
    <circle cx="56" cy="128" r="13"/><circle cx="200" cy="128" r="13"/>
    <circle cx="56" cy="200" r="13"/><circle cx="128" cy="200" r="13"/><circle cx="200" cy="200" r="13"/>
