  <rect width="256" height="256" rx="52" fill="#0B1020"/>
  <g stroke="#7C83FD" stroke-width="8" stroke-linecap="round" opacity="0.72">
    <path d="M56 56H128H200M56 128H128H200M56 200H128H200"/>
