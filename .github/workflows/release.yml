name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to verify and publish
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: verify and publish GitHub release
    if: github.repository == 'hamburger-os/CodexLattice'
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Verify tag matches package version
        run: node -e "const p=JSON.parse(require('fs').readFileSync('package.json','utf8')); if(process.env.RELEASE_TAG !== 'v'+p.version){throw new Error('tag '+process.env.RELEASE_TAG+' does not match package version '+p.version)}"
      - run: npm test
      - run: npm run check
      - run: npm run verify:package
      - name: Pack release tarball
        run: |
          npm pack --json > pack.json
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('pack.json','utf8'))[0]; fs.appendFileSync(process.env.GITHUB_ENV, 'TARBALL='+p.filename+'\n');"
          sha256sum "$(node -p "JSON.parse(require('fs').readFileSync('pack.json','utf8'))[0].filename")" > SHA256SUMS.txt
      - name: Verify tarball installs cleanly and reports manifest version
        run: |
          PREFIX="$(mktemp -d)"
          npm install --global --prefix "$PREFIX" "./$TARBALL"
          EXPECTED_VERSION="$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")"
          ACTUAL_VERSION="$("$PREFIX/bin/codex-lattice" version)"
          if [ "$ACTUAL_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "installed CLI version $ACTUAL_VERSION does not match package.json $EXPECTED_VERSION" >&2
            exit 1
          fi
      - name: Create or refresh GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$TARBALL" SHA256SUMS.txt --clobber
          else
            gh release create "$RELEASE_TAG" "$TARBALL" SHA256SUMS.txt --verify-tag --generate-notes --title "$RELEASE_TAG"
          fi
