name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: verify and publish GitHub release
    if: github.repository == 'hamburger-os/CodexLattice'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Verify tag matches package version
        run: node -e "const p=JSON.parse(require('fs').readFileSync('package.json','utf8')); if(process.env.GITHUB_REF_NAME !== 'v'+p.version){throw new Error('tag '+process.env.GITHUB_REF_NAME+' does not match package version '+p.version)}"
      - run: npm test
      - run: npm run check
      - run: npm run verify:package
      - name: Pack release tarball
        run: |
          npm pack --json > pack.json
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('pack.json','utf8'))[0]; fs.appendFileSync(process.env.GITHUB_ENV, 'TARBALL='+p.filename+'\n');"
          sha256sum "$(node -p "JSON.parse(require('fs').readFileSync('pack.json','utf8'))[0].filename")" > SHA256SUMS.txt
      - name: Verify tarball installs cleanly
        run: |
          PREFIX="$(mktemp -d)"
          npm install --global --prefix "$PREFIX" "./$TARBALL"
          "$PREFIX/bin/codex-lattice" version
      - name: Create or refresh GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$TARBALL" SHA256SUMS.txt --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$TARBALL" SHA256SUMS.txt --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
          fi
