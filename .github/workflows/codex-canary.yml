name: Codex latest canary

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  latest-codex:
    name: latest Codex smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install latest Codex CLI
        run: npm install -g @openai/codex@latest
      - name: Record latest Codex version
        run: codex --version
      - name: Install CodexLattice package globally
        run: npm install -g .
      - name: Run structural compatibility smoke without model calls
        run: npm run test:codex-smoke
