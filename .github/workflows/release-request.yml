name: release request

on:
  push:
    branches:
      - main
    paths:
      - ".github/release-requests/*.json"

permissions:
  contents: write
  actions: write

concurrency:
  group: release-request-main
  cancel-in-progress: false

jobs:
  tag:
    name: validate request, create tag, dispatch release
    if: github.repository == 'hamburger-os/CodexLattice'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reviewed main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Configure release tag identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Apply reviewed release requests
        run: node scripts/release-request.mjs --apply --output "$RUNNER_TEMP/release-tags.txt"
      - name: Dispatch release workflow for newly created tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -s "$RUNNER_TEMP/release-tags.txt" ]; then
            echo "No new release tags were created."
            exit 0
          fi
          while IFS= read -r tag; do
            echo "Dispatching release.yml for $tag"
            gh workflow run release.yml --ref main -f tag="$tag"
          done < "$RUNNER_TEMP/release-tags.txt"
