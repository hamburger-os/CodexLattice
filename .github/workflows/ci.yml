name: ci
on: [push, pull_request]

jobs:
  unit:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - run: npm run check

  real-codex-install:
    name: real Codex install smoke (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install tested Codex CLI
        run: npm install -g @openai/codex@0.149.1
      - name: Confirm Codex CLI
        run: codex --version
      - name: Install CodexLattice into a temporary real CODEX_HOME
        run: npm run test:codex-smoke
