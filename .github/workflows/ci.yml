name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm test
      - run: npm run check

  real-codex-install:
    name: real Codex install smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install tested Codex CLI
        run: npm install -g @openai/codex@0.149.1
      - name: Confirm Codex CLI
        run: codex --version
      - name: Install CodexLattice package globally
        run: npm install -g .
      - name: Confirm CodexLattice global bin
        run: codex-lattice version
      - name: Install CodexLattice into a temporary real CODEX_HOME
        run: npm run test:codex-smoke

  package-verification:
    name: package verification (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm run verify:package

  evaluation-contract:
    name: evaluation contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Validate versioned evaluation corpus, runners, and study split
        run: npm run eval:validate
      - name: Prove single-pair planning mode makes no model calls
        run: npm run eval:plan -- --task easy-slugify --runner sol-medium
      - name: Prove full seeded paired-study planning makes no model calls
        run: npm run eval:plan -- --all --trials 1 > /dev/null

  required:
    name: required / ci
    if: ${{ always() }}
    needs: [unit, real-codex-install, package-verification, evaluation-contract]
    runs-on: ubuntu-latest
    steps:
      - name: Require all CI groups to pass
        env:
          UNIT_RESULT: ${{ needs.unit.result }}
          CODEX_RESULT: ${{ needs.real-codex-install.result }}
          PACKAGE_RESULT: ${{ needs.package-verification.result }}
          EVALUATION_RESULT: ${{ needs.evaluation-contract.result }}
        run: |
          test "$UNIT_RESULT" = "success"
          test "$CODEX_RESULT" = "success"
          test "$PACKAGE_RESULT" = "success"
          test "$EVALUATION_RESULT" = "success"
