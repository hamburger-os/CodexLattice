name: Bug report
description: Report a reproducible CodexLattice defect
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Remove tokens, credentials, private prompts, proprietary source, and unrelated Codex configuration before posting.
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11 / macOS 15 / Ubuntu 24.04
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: node --version
    validations:
      required: true
  - type: input
    id: codex
    attributes:
      label: Codex CLI version
      placeholder: codex --version
    validations:
      required: true
  - type: input
    id: lattice
    attributes:
      label: CodexLattice version
      placeholder: codex-lattice version
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Commands and sanitized configuration needed to reproduce the problem.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Sanitized doctor output
      description: Paste `codex-lattice doctor --strict` output after removing sensitive data.
      render: text
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Privacy check
      options:
        - label: I removed tokens, credentials, private prompts, and proprietary source code.
          required: true
